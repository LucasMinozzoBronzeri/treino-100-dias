<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#09090b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gym Bronze" />
  <title>Gym Bronze</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="./style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button class="quick-menu-btn" id="openQuickMenu" type="button" aria-label="Abrir menu rápido">⋯</button>
      <div class="brand-wrap">
        <img class="brand-logo" src="./icons/icon-192.png" alt="Gym Bronze">
        <div>
          <p class="eyebrow">Gym Bronze</p>
          <h1 id="screenTitle">Hoje</h1>
        </div>
      </div>
      <button class="profile-pill" id="openProfileSwitcher" type="button" aria-label="Trocar perfil">
        <span class="avatar-dot" id="profileInitial">?</span>
        <span id="activeProfileName">Perfil</span>
      </button>
      <button class="level-pill hidden" id="openLevelModal" type="button" aria-label="Ver nível e patentes">
        <span class="level-icon">Ⅰ</span>
        <span class="level-copy"><strong id="activeRankName">Frango</strong><small id="activeLevelText">Nv. I</small></span>
      </button>
    </header>

    <main id="content" class="content"></main>

    <nav class="bottom-nav" aria-label="Navegação principal">
      <button data-screen="home" class="nav-btn active" type="button">🏠<span>Hoje</span></button>
      <button data-screen="workouts" class="nav-btn" type="button">🏋️<span>Treinos</span></button>
      <button data-screen="lessons" class="nav-btn" type="button">🧘<span>Aulas</span></button>
      <button data-screen="checkin" class="nav-btn" type="button">📸<span>Check-in</span></button>
      <button data-screen="coach" class="nav-btn" type="button">🥗<span>Nutri</span></button>
      <button data-screen="progress" class="nav-btn" type="button">📈<span>Progresso</span></button>
    </nav>
  </div>

  <div id="modalLayer" class="modal-layer hidden" role="dialog" aria-modal="true"></div>
  <div id="toast" class="toast hidden"></div>

  <script src="./app.js" defer></script>
</body>
</html>
