<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ff7a00" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Treino 100" />
  <title>Treino 100 Dias Pro</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand-wrap">
        <img class="brand-logo" src="./icons/icon-192.png" alt="Treino 100 Dias">
        <div>
          <p class="eyebrow">Treino 100 Dias</p>
          <h1 id="screenTitle">Início</h1>
        </div>
      </div>
      <button class="profile-pill" id="openProfileSwitcher" type="button" aria-label="Trocar perfil">
        <span class="avatar-dot" id="profileInitial">L</span>
        <span id="activeProfileName">Lucas</span>
      </button>
    </header>

    <main id="content" class="content"></main>

    <nav class="bottom-nav" aria-label="Navegação principal">
      <button data-screen="home" class="nav-btn active" type="button">🏠<span>Início</span></button>
      <button data-screen="workouts" class="nav-btn" type="button">🏋️<span>Treinos</span></button>
      <button data-screen="progress" class="nav-btn" type="button">📈<span>Progresso</span></button>
      <button data-screen="checkin" class="nav-btn" type="button">📸<span>Check-in</span></button>
      <button data-screen="coach" class="nav-btn" type="button">⚡<span>Análise</span></button>
      <button data-screen="profile" class="nav-btn" type="button">👤<span>Perfil</span></button>
    </nav>
  </div>

  <div id="modalLayer" class="modal-layer hidden" role="dialog" aria-modal="true"></div>
  <div id="toast" class="toast hidden"></div>

  <script src="./app.js" defer></script>
</body>
</html>
