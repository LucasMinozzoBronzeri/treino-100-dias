<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FAF9F7" />
  <script>
  (function(){try{var t=localStorage.getItem('gymBronze.theme');if(t!=='light'&&t!=='dark')t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',t==='dark'?'#0A0A0B':'#FAF9F7');}catch(e){document.documentElement.setAttribute('data-theme','light');}})();
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Gym Bronze" />
  <title>Gym Bronze</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="./style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button class="quick-menu-btn" id="openQuickMenu" type="button" aria-label="Abrir menu rápido">⋯</button>
      <div class="brand-wrap">
        <img class="brand-logo" src="./icons/icon-192.png" alt="Gym Bronze">
        <div>
          <p class="eyebrow">Gym Bronze</p>
          <h1 id="screenTitle">Hoje</h1>
        </div>
      </div>
      <button class="profile-pill" id="openProfileSwitcher" type="button" aria-label="Trocar perfil">
        <span class="avatar-dot" id="profileInitial">?</span>
        <span id="activeProfileName">Perfil</span>
      </button>
      <button class="level-pill hidden" id="openLevelModal" type="button" aria-label="Ver nível e patentes">
        <span class="level-icon">Ⅰ</span>
        <span class="level-copy"><strong id="activeRankName">Frango</strong><small id="activeLevelText">Nv. I</small></span>
      </button>
    </header>

    <main id="content" class="content"></main>

    <nav class="bottom-nav" aria-label="Navegação principal"><div class="nav-inner">
      <button data-screen="home" class="nav-btn active" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5L12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg><span>Hoje</span></button>
      <button data-screen="workouts" class="nav-btn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg><span>Treinos</span></button>
      <button data-screen="checkin" class="nav-btn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"/></svg><span>Check-in</span></button>
      <button data-screen="coach" class="nav-btn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19c0-8 5-13 14-14 0 9-5 14-13 14"/><path d="M5 19c3-4 6-6.5 10-8.5"/></svg><span>Nutri</span></button>
      <button data-screen="progress" class="nav-btn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M7.5 15l3.5-4 3 2.5 4.5-6"/></svg><span>Evolução</span></button>
    </div></nav>
  </div>

  <div id="modalLayer" class="modal-layer hidden" role="dialog" aria-modal="true"></div>
  <div id="toast" class="toast hidden"></div>

  <script src="./app.js" defer></script>
</body>
</html>
